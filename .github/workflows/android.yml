name: android
# Debug-APK прототипа: на PR — только артефакт; на пуш в develop — ещё и
# pre-release «proto-latest» с прямой ссылкой на .apk (удобно с телефона).
# Debug-ключ хранится в кэше Actions, чтобы новые сборки ставились поверх старых.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Godot 4.7.2
        run: sh tools/setup_godot.sh .godot-bin
      - name: Кэш шаблонов экспорта Android
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-android-templates
      - name: Шаблоны экспорта (только Android)
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          D=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p $D
          unzip -o -q -j tpl.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d $D
          rm tpl.tpz
      - name: Debug-ключ (один на все сборки)
        uses: actions/cache@v4
        with:
          path: ~/.android/godot-debug.keystore
          key: godot-debug-keystore-v1
      - name: Тесты
        run: .godot-bin/godot --headless -s tests/run_all.gd
      - name: Экспорт APK
        run: sh tools/ci_export_android.sh "$PWD/.godot-bin/godot" "$PWD/build/davlenie-proto-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: davlenie-proto-debug
          path: build/davlenie-proto-debug.apk
      - name: Pre-release proto-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete proto-latest -y --cleanup-tag || true
          gh release create proto-latest build/davlenie-proto-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Прототип: последняя сборка develop" \
            --notes "Debug-сборка с коммита ${GITHUB_SHA}. Ставится поверх предыдущей (один debug-ключ)."
