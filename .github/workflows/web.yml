name: web
# Веб-сборка прототипа → GitHub Pages (играть с телефона по ссылке).
# Запуск вручную: Actions → web → Run workflow.
# Перед первым запуском: Settings → Pages → Source: GitHub Actions и
# Settings → Environments → github-pages → разрешить ветку develop.
# (Автозапуск на пуш выключен: Pages не включены, и прогон падал на публикации.)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2
        run: sh tools/setup_godot.sh .godot-bin
      - name: Кэш шаблонов экспорта
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-web-templates
      - name: Шаблоны экспорта (только Web, без потоков)
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          D=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p $D
          unzip -o -q -j tpl.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d $D
          rm tpl.tpz
      - name: Тесты
        run: .godot-bin/godot --headless -s tests/run_all.gd
      - name: Экспорт Web
        run: |
          mkdir -p build/web
          .godot-bin/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.pck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
