name: tests
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2
        run: sh tools/setup_godot.sh .godot-bin
      - name: Тесты
        run: .godot-bin/godot --headless -s tests/run_all.gd
